# ObsidianDesk — dev compose stack.
#
# `docker compose up` boots:
#   - solana-validator (Agave) on host :18899 (RPC) + :18900 (WS)
#   - app (Next.js) on host :13000
#   - keeper (Node) on host :13001
#
# Per the project port convention (memory: feedback_docker_ports), every
# host port is offset to the non-standard range so the stack never
# collides with other local Docker projects.
#
# Notes:
#   - Encrypt + Ika SDKs run in-process inside the keeper / app
#     (OBSIDIAN_*_MODE=mock). No separate mock containers — the upstream
#     vendor packages don't ship compiled .ts (gap E5/I0); a faithful
#     standalone HTTP mock would require rewriting the SDK as a server.
#   - signet BTC is fetched from mempool.space directly (the wizard's
#     esplora poll). No btc-signet container needed for the demo.
#   - The keeper currently expects target/idl/obsidian_core.json on disk.
#     `anchor build` on the host populates ./target; we bind-mount it
#     read-only so the keeper image doesn't depend on a separate
#     program-build pipeline (deferred to P11).

name: obsidian-desk

services:
  # One-shot init: chown the shared dWallet-keys volume to uid:gid 1001
  # before the long-running services start. Docker creates named-volume
  # mountpoints owned by root, but `app` and `keeper` both run as 1001
  # (`nextjs` / `keeper` user). Without this step, the first deploy on a
  # fresh host hits EACCES the moment either container tries to write
  # `/var/obsidian/keys/mock-keys.json.tmp.*`.
  keys-init:
    image: busybox:1.37
    container_name: obsidian-keys-init
    command: ['sh', '-c', 'chown -R 1001:1001 /var/obsidian/keys && chmod 700 /var/obsidian/keys']
    volumes:
      - obsidian-keys:/var/obsidian/keys
    restart: 'no'

  solana-validator:
    # Opt-in via `docker compose --profile local-rpc up`. Reasoning:
    # Anza ships only linux/amd64 images, and current Agave 3.x panics
    # under qemu (`io_uring NOT supported`) — so on M-series Macs the
    # in-container validator is unusable. Default UX assumes you run
    # `solana-test-validator --rpc-port 18899 --bind-address 127.0.0.1`
    # on the host. Linux/x86 users opt in with the profile.
    profiles: ['local-rpc']
    image: anzaxyz/agave:stable
    platform: linux/amd64
    container_name: obsidian-validator
    command:
      - solana-test-validator
      - --rpc-port
      - '8899'
      - --rpc-bind-address
      - 0.0.0.0
      - --bind-address
      - 0.0.0.0
      - --no-rocksdb-compaction
      - --reset
    ports:
      - '18899:8899'   # JSON-RPC
      - '18900:8900'   # WebSocket
    volumes:
      - solana-ledger:/test-ledger
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -o /dev/null -X POST -H 'content-type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://127.0.0.1:8899"
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: obsidian-app:dev
    container_name: obsidian-app
    environment:
      # The browser hits the validator on the host port (browsers don't
      # see the docker-network alias). Keep both vars for completeness:
      # the public one is for the wallet adapter in the browser; the
      # docker-internal one is for any future server-side RPC calls.
      # Default to host.docker.internal:18899 so the stack works without
      # the `local-rpc` profile (Mac/Apple-silicon path); override to
      # http://solana-validator:8899 when running with --profile local-rpc.
      NEXT_PUBLIC_SOLANA_RPC: http://127.0.0.1:18899
      SOLANA_RPC: ${SOLANA_INTERNAL_RPC:-http://host.docker.internal:18899}
      NEXT_PUBLIC_OBSIDIAN_PROGRAM_ID: H25yY5o4emorZ9qMHAUvJhdtrFjDSeYy2MVYurpQbeLp
      NEXT_PUBLIC_NETWORK: devnet
      OBSIDIAN_ESPLORA_URL: https://mempool.space/signet/api
      # Auto-fallback: try the live pre-alpha networks first, fall back to
      # mock if they're down or unreachable. See sdk/src/mode.ts.
      OBSIDIAN_ENCRYPT_MODE: ${OBSIDIAN_ENCRYPT_MODE:-mock}
      OBSIDIAN_IKA_MODE: ${OBSIDIAN_IKA_MODE:-auto}
      OBSIDIAN_BTC_MODE: ${OBSIDIAN_BTC_MODE:-auto}
      # Shared file-backed dWallet store (closes gap I2 across processes:
      # the Next.js server writes here on /deposit, the keeper reads from
      # here when settling). Mounted as a named volume below.
      OBSIDIAN_MOCK_STORE_PATH: /var/obsidian/keys/mock-keys.json
    ports:
      - '13000:3000'
    depends_on:
      keys-init:
        condition: service_completed_successfully
    volumes:
      - obsidian-keys:/var/obsidian/keys
      # /positions reads MatchRecord PDAs via the IDL — same bind-mount as
      # the keeper. Anchor's IDL ships per-build to target/idl on the host.
      - ./target/idl:/app/target/idl:ro
    # `solana-validator` runs under the `local-rpc` profile (opt-in) —
    # don't make app a hard depend, otherwise `docker compose up`
    # without the profile blocks forever waiting for it. Users who do
    # `--profile local-rpc up` get the validator + the dependency
    # ordering benefit; everyone else points at a host-side validator.
    extra_hosts:
      # Make `host.docker.internal` resolve on Linux too (it's native on
      # Docker Desktop). Required for the host-validator default above.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  keeper:
    build:
      context: .
      dockerfile: keeper/Dockerfile
    image: obsidian-keeper:dev
    container_name: obsidian-keeper
    environment:
      # Default to host.docker.internal:18899 (host-side validator, the
      # documented Mac/Apple-silicon path). Override to
      # http://solana-validator:8899 when running with --profile local-rpc.
      ANCHOR_PROVIDER_URL: ${SOLANA_INTERNAL_RPC:-http://host.docker.internal:18899}
      ANCHOR_WALLET: /run/secrets/keeper_keypair.json
      OBSIDIAN_PROGRAM_ID: H25yY5o4emorZ9qMHAUvJhdtrFjDSeYy2MVYurpQbeLp
      # Auto-fallback by default — try real Ika MPC, fall back to mock if
      # pre-alpha network is unreachable. Override per-deploy via env.
      OBSIDIAN_IKA_MODE: ${OBSIDIAN_IKA_MODE:-auto}
      OBSIDIAN_BTC_MODE: ${OBSIDIAN_BTC_MODE:-auto}
      OBSIDIAN_MOCK_STORE_PATH: /var/obsidian/keys/mock-keys.json
      KEEPER_POLL_MS: '3000'
      KEEPER_PORT: '3001'
      KEEPER_FEERATE: '4'
    ports:
      - '13001:3001'
    depends_on:
      keys-init:
        condition: service_completed_successfully
    # See app: validator dependency is opt-in via the `local-rpc` profile.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    secrets:
      - keeper_keypair.json
    volumes:
      # Anchor IDL produced by `anchor build` on the host. Read-only.
      # Path matches the keeper's `process.cwd()` (= /app inside the
      # deployed bundle) + the `loadIdl()` lookup at target/idl/...
      - ./target/idl:/app/target/idl:ro
      # Shared dWallet store with the app container — both ends read/write
      # the same JSON file so deposit-page-created dWallets are visible to
      # the keeper at settle time.
      - obsidian-keys:/var/obsidian/keys
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/status']
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

secrets:
  keeper_keypair.json:
    # The host file the keeper signs with. Defaults to the user's
    # standard solana keypair; override per environment.
    file: ${KEEPER_KEYPAIR_PATH:-./scripts/.keeper-keypair.json}

volumes:
  solana-ledger:
  # Shared between the `app` and `keeper` services so the file-backed
  # mock dWallet store (sdk/src/mock-store.ts) survives across the two
  # process boundaries — closure of gap I2 for the demo path.
  obsidian-keys:
