[package]
name = "obsidian-core"
version = "0.1.0"
description = "ObsidianDesk core — encrypted limit orderbook with FHE matching (Encrypt) and dWallet settlement (Ika)."
edition = "2021"
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "obsidian_core"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
# Optional features expanded by Anchor / solana-program-entrypoint macros.
# Declared here so `unexpected_cfgs` lint stays clean under `-D warnings`.
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
# Solana sha256 syscall — used for Bitcoin SPV merkle inclusion verification
# in src/spv.rs. The `sha2` feature is required for off-chain compilation
# (cargo test); on-chain BPF builds use the syscall directly.
solana-sha256-hasher = { version = "3.1", default-features = false, features = ["sha2"] }

# Encrypt-pre-alpha integration: real FHE matching via execute_graph CPI.
# Pinned to upstream commit dadfff8 (2026-05-07). Closes gap E2.
# `encrypt-dsl` is the package alias the upstream proc-macro emits — match
# their voting/anchor example's Cargo.toml.
encrypt-types = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha", rev = "dadfff8cfa82c7a5d4c463d7f967177462124552", default-features = false }
# encrypt-anchor is VENDORED locally — closes gap E2-residual. The upstream
# at the same rev demotes outer-tx signer flags on output ciphertext accounts,
# breaking our 6-input/3-output match graph CPI. See crates/encrypt-anchor-vendor.
encrypt-anchor = { path = "../../crates/encrypt-anchor-vendor" }
encrypt-dsl = { package = "encrypt-solana-dsl", git = "https://github.com/dwallet-labs/encrypt-pre-alpha", rev = "dadfff8cfa82c7a5d4c463d7f967177462124552" }

[lints.rust]
# `target_os = "solana"` is set by the Solana BPF target, not a Cargo feature.
# Declared here so check-cfg accepts it under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
