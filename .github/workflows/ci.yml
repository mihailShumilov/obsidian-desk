name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'
  # Rust 1.94 + Anchor 1.0.2 to match `rust-toolchain.toml` and the
  # `encrypt-anchor` upstream's expectations. The repo upgraded from
  # 0.32 → 1 for gap E2 closure; older toolchains can't build it.
  RUST_TOOLCHAIN: '1.94'
  ANCHOR_VERSION: '1.0.2'
  SOLANA_INSTALL_URL: 'https://release.anza.xyz/stable/install'

jobs:
  ts:
    name: TypeScript (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json (pnpm@9.15.4).
      # Specifying `version:` here would conflict — see ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # SDK must be built first — keeper + app import `@obsidian-desk/sdk`
      # whose types come from `sdk/dist/index.d.ts`. On a clean CI checkout
      # that file doesn't exist until the SDK is compiled, so plain
      # `pnpm -r typecheck` would fail with TS2307 in keeper/app.
      - run: pnpm -F @obsidian-desk/sdk build
      - run: pnpm -r typecheck
      - run: pnpm -r build

  rust:
    name: Anchor build + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL ${{ env.SOLANA_INSTALL_URL }})"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor
        # anchor-cli is published to crates.io for v1+, so install directly
        # via cargo. Avoids the avm download path which has historically
        # rate-limited from CI runners (`error decoding response body:
        # operation timed out`).
        run: cargo install anchor-cli@${{ env.ANCHOR_VERSION }} --locked
      - name: cargo clippy
        # Skip --all-targets to keep `idl-build` cfg out of the compile;
        # workspace clippy still covers programs/* lib + tests.
        run: cargo clippy --workspace -- -D warnings
      - name: anchor build
        # `--no-idl` so the BPF compile completes before we try to extract
        # the IDL; v1's IDL build is a separate `anchor idl build` step.
        run: anchor build --no-idl
