name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9'
  RUST_TOOLCHAIN: '1.93'
  ANCHOR_VERSION: '0.32.1'
  SOLANA_INSTALL_URL: 'https://release.anza.xyz/stable/install'

jobs:
  ts:
    name: TypeScript (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build

  rust:
    name: Anchor build + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL ${{ env.SOLANA_INSTALL_URL }})"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: anchor build
        run: anchor build
