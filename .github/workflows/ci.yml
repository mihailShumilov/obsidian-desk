name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight CI run for the same branch / PR — saves minutes
# when devs push a fixup commit before the previous run finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Rust 1.94 + Anchor 1.0.2 to match `rust-toolchain.toml` and the
  # `encrypt-anchor` upstream's expectations. The repo upgraded from
  # 0.32 → 1 for gap E2 closure; older toolchains can't build it.
  RUST_TOOLCHAIN: '1.94'
  ANCHOR_VERSION: '1.0.2'
  SOLANA_INSTALL_URL: 'https://release.anza.xyz/stable/install'
  # Force the v4 actions onto the runner's Node 24 so the deprecation
  # warning for Node 20 doesn't clutter the logs (and we're ahead of the
  # 2026-09-16 forced-removal date).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ts:
    name: TypeScript (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from `packageManager` in package.json (pnpm@9.15.4).
      # Specifying `version:` here would conflict — see ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # SDK must be built first — keeper + app import `@obsidian-desk/sdk`
      # whose types come from `sdk/dist/index.d.ts`. On a clean CI checkout
      # that file doesn't exist until the SDK is compiled, so plain
      # `pnpm -r typecheck` would fail with TS2307 in keeper/app.
      - name: Build SDK (consumed by app + keeper for typecheck)
        run: pnpm -F @obsidian-desk/sdk build
      - name: SDK unit tests
        # Covers the auto-fallback mode resolver, file-backed dWallet store,
        # BIP-143 sighash + DER + low-s pipeline, mempool.space helpers,
        # and the mainnet safety guard. ~74 tests, runs in <2s.
        run: pnpm -F @obsidian-desk/sdk test
      - name: Typecheck workspaces
        run: pnpm -r typecheck
      - name: Build workspaces
        run: pnpm -r build

  rust:
    name: Anchor build + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL ${{ env.SOLANA_INSTALL_URL }})"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor
        # anchor-cli is published to crates.io for v1+, so install directly
        # via cargo. Avoids the avm download path which has historically
        # rate-limited from CI runners (`error decoding response body:
        # operation timed out`).
        run: cargo install anchor-cli@${{ env.ANCHOR_VERSION }} --locked
      - name: cargo clippy
        # Skip --all-targets to keep `idl-build` cfg out of the compile;
        # workspace clippy still covers programs/* lib + tests.
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test (host-side unit tests)
        # SPV merkle inclusion verifier lives in programs/obsidian-core/src/spv.rs
        # and has 4 host-runnable tests. Adding any new pure-Rust unit tests
        # under `#[cfg(test)]` blocks covers them automatically.
        run: cargo test --workspace --lib
      - name: anchor build
        # `--no-idl` so the BPF compile completes before we try to extract
        # the IDL; v1's IDL build is a separate `anchor idl build` step.
        # `--ignore-keys` because the program keypair file is per-developer
        # (gitignored) — the source-of-truth program id is the `declare_id!`
        # in lib.rs which matches the deployed devnet/localnet entries in
        # Anchor.toml.
        run: anchor build --no-idl --ignore-keys
      - name: Upload program artifact
        # Uploads target/deploy/obsidian_core.so so it can be picked up by
        # release tags (anchor upgrade target/deploy/obsidian_core.so) without
        # rebuilding locally. 90-day retention matches GitHub's default.
        uses: actions/upload-artifact@v4
        with:
          name: obsidian_core-so
          path: target/deploy/obsidian_core.so
          retention-days: 90
          if-no-files-found: error
