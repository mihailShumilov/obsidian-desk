# ObsidianDesk — devnet/signet production overlay.
#
# Layered on top of docker-compose.yml; drops the local validator (use a
# real Solana RPC) and pins images to GHCR.
#
# As of 2026-05-07 this overlay defaults to **auto mode** for every subsystem
# (Encrypt, Ika, BTC). `auto` tries the real pre-alpha networks first and
# falls back to mock on transient failure — see sdk/src/mode.ts. The base
# `docker-compose.yml` provides the same defaults for non-prod runs; this
# overlay just inherits them and adds GHCR pinning + restart policy.
#
# Each subsystem can be overridden per-deploy:
#   OBSIDIAN_ENCRYPT_MODE=auto|real|mock
#   OBSIDIAN_IKA_MODE=auto|real|mock
#   OBSIDIAN_BTC_MODE=auto|real|mock
#
# `assertNotMockOnMainnet` in the SDK refuses `mock` or `auto` on mainnet —
# only explicit `real` clears the gate (auto can fall back to mock at any
# time, which would expose plaintext on a live-value chain).
#
# Compose command:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.production up -d
#
# Required environment (host or .env.production):
#   SOLANA_RPC                           https://api.devnet.solana.com (or your node)
#   NEXT_PUBLIC_SOLANA_RPC               same URL the browser should hit
#   OBSIDIAN_PROGRAM_ID                  pinned program id
#   KEEPER_KEYPAIR_PATH                  absolute path to the keeper signer keypair

name: obsidian-desk

services:
  # Disable the dev-only validator in prod: depend on an external RPC.
  solana-validator:
    profiles: ['disabled']

  app:
    image: ghcr.io/mihailshumilov/obsidian-app:${IMAGE_TAG:-latest}
    pull_policy: always
    build: !reset null
    environment:
      NEXT_PUBLIC_SOLANA_RPC: ${NEXT_PUBLIC_SOLANA_RPC:?set NEXT_PUBLIC_SOLANA_RPC}
      SOLANA_RPC: ${SOLANA_RPC:?set SOLANA_RPC}
      NEXT_PUBLIC_OBSIDIAN_PROGRAM_ID: ${OBSIDIAN_PROGRAM_ID:?set OBSIDIAN_PROGRAM_ID}
      # Market PDA the /trade page submits orders into. Optional — when
      # unset, /trade falls back to the local-only stub flow.
      NEXT_PUBLIC_OBSIDIAN_MARKET: ${NEXT_PUBLIC_OBSIDIAN_MARKET:-}
      NEXT_PUBLIC_NETWORK: ${NEXT_PUBLIC_NETWORK:-devnet}
      OBSIDIAN_ESPLORA_URL: ${OBSIDIAN_ESPLORA_URL:-https://mempool.space/signet/api}
      # Tri-state modes — default `auto` (try real, fall back to mock on
      # transient failure). See sdk/src/mode.ts. assertNotMockOnMainnet
      # still gates mainnet, so `auto` is safe on devnet/signet.
      OBSIDIAN_ENCRYPT_MODE: ${OBSIDIAN_ENCRYPT_MODE:-auto}
      OBSIDIAN_IKA_MODE: ${OBSIDIAN_IKA_MODE:-auto}
      OBSIDIAN_BTC_MODE: ${OBSIDIAN_BTC_MODE:-auto}
      # Shared file-backed dWallet store across app + keeper.
      OBSIDIAN_MOCK_STORE_PATH: /var/obsidian/keys/mock-keys.json
    depends_on: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: always

  keeper:
    image: ghcr.io/mihailshumilov/obsidian-keeper:${IMAGE_TAG:-latest}
    pull_policy: always
    build: !reset null
    environment:
      ANCHOR_PROVIDER_URL: ${SOLANA_RPC:?set SOLANA_RPC}
      ANCHOR_WALLET: /run/secrets/keeper_keypair.json
      OBSIDIAN_PROGRAM_ID: ${OBSIDIAN_PROGRAM_ID:?set OBSIDIAN_PROGRAM_ID}
      OBSIDIAN_IKA_MODE: ${OBSIDIAN_IKA_MODE:-auto}
      OBSIDIAN_BTC_MODE: ${OBSIDIAN_BTC_MODE:-auto}
      OBSIDIAN_MOCK_STORE_PATH: /var/obsidian/keys/mock-keys.json
      KEEPER_POLL_MS: ${KEEPER_POLL_MS:-3000}
      KEEPER_PORT: '3001'
      KEEPER_FEERATE: ${KEEPER_FEERATE:-4}
    depends_on: !reset []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    restart: always
