[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
obsidian_core = "obsiDeskCoreProgram111111111111111111111111"

[programs.devnet]
obsidian_core = "obsiDeskCoreProgram111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec mocha -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.devnet.solana.com"
